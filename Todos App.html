<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Task</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./src/styles/Todos.css" />
</head>

<body>
  <header id="headingTaskContainer">
    <div id="smallScreenHeader">
      <!-- <div class="todoHEADING"> <h1>TODO</h1></div> -->
     <h1>TODO</h1>
      <!-- it is  only for small screen  it will hide in big screen-->
      <div id="allTaskBtn">
        <div id="backBtn">Backlog</div>
        <div id="todoBtn">Todo</div>
        <div id="proBtn">In progress</div>
        <div id="donBtn">Done</div>
        <div id="expiryBtn">Expire</div>
         <!-- end -->
      </div>
    </div>
    <!-- this is for task creating section -->
    <div id="InputTaskContainer">
      <input id="taskInput" type="text" placeholder="Enter your task...">
      <input id="dueDate" type="date" placeholder="Select due date...">
      <button id="addBtn">Add Task</button>
    </div>
    <!-- end -->
    <!-- there is a dedicated input field for searching task -->
    <div id="searchContainer">
      <div id="searchIcon"><img src="./public/images/search.svg"></div>
      <input id="searchInput" type="text" placeholder="Search tasks...">
      <div id="searchClearIcons">
        <div id="clearBtn"><img src="./public/images/clear.svg"></div>
        <div id="searchBtn"><i class="fa-solid fa-arrow-right-long"></i></div>
      </div>
    </div>
    <!-- end -->
  </header>
  <main>
    <!-- this is slider that contain five section box-shadow: 0px 2px 15px 1px rgb(182, 176, 176);-->
    <div class="containertwoicons">
      <div id="tasksectionContainer">

        <div class="taskContainer">
          <div id="containerDelayList" >
            <h3 id="bTaskHeading">Backlog <span>0</span></h3>
            <ol id="delayList"> </ol>
          </div>

          <div id="containerTodoList" >
            <h3 id="tTaskHeading">To do <span>0</span></h3>
            <ol id="todoList"> </ol>
          </div>

          <div id="containerProgressList" >
            <h3 id="pTaskHeading">In Progress <span>0</span></h3>
            <ol id="progressList"></ol>
          </div>

          <div id="containerCompletedList" >
            <h3 id="dTaskHeading">Done <span>0</span></h3>
            <ol id="completedList"> </ol>
          </div>

          <div id="signTodoList" >
            <h3 id="eTaskHeading">Expired <span>0</span></h3>
            <ol id="signList"> </ol>
          </div>

        </div>
      </div>

      <!-- sliderButton -->
        <button id="sliderRightBtn"><i class="fa-solid fa-chevron-right"></i></button>
      <button id="sliderLeftBtn"><i class="fa-solid fa-chevron-left"></i></button>
       
    </div>
    <!-- end -->
  </main>
 
  <script src="./src/scripts/Todos.js" type="module"></script>

  <script src="./src/scripts/reload.js" type="module"></script>

  <script src="./src/scripts/slider.js" type="module"></script>

  <script src="./src/scripts/createTasks.js" type="module"></script>

  <script src="./src/scripts/moveBackTask.js" type="module"></script>

  <script src="./src/scripts/moveforwardTask.js" type="module"></script>

  <script src="./src/scripts/deleteTask.js" type="module"></script>

  <script src="./src/scripts/searchTask.js" type="module"></script>

  <script src="./src/scripts/addTask.js" type="module"></script>
 
 

</body>

</html>
