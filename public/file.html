window.addEventListener("DOMContentLoaded", ()=> {
   // Load TODO tasks
  let storedTodo = localStorage.getItem("TODO");
  if (storedTodo) {
    todoListData.length = 0;               
    let todos = JSON.parse(storedTodo);    
    for (let i = 0; i < todos.length; i++) {
      todoListData.push(todos[i]);         
    }
  }

  // Load PROGRESS tasks
  let storedProgress = localStorage.getItem("PROGRESS");
  if (storedProgress) {
    progressListData.length = 0;
    let progress = JSON.parse(storedProgress);
    for (let i = 0; i < progress.length; i++) {
      progressListData.push(progress[i]);
    }
  }

  // Load COMPLETED tasks
  let storedCompleted = localStorage.getItem("COMPLETED");
  if (storedCompleted) {
    completedListData.length = 0;
    let completed = JSON.parse(storedCompleted);
    for (let i = 0; i < completed.length; i++) {
      completedListData.push(completed[i]);
    }
  }

  // Load SIGN tasks
  let storedSign = localStorage.getItem("SIGN");
  if (storedSign) {
    signListData.length = 0;
    let sign = JSON.parse(storedSign);
    for (let i = 0; i < sign.length; i++) {
      signListData.push(sign[i]);
    }
  }

  // Load BACKLOG tasks
  let storedBacklog = localStorage.getItem("BACKLOG");
  if (storedBacklog) {
    delayListData.length = 0;
    let backlog = JSON.parse(storedBacklog);
    for (let i = 0; i < backlog.length; i++) {
      delayListData.push(backlog[i]);
    }
  }

  // Render all lists
  createTodoList();
  createProgressList();
  createCompletedList();
  createSignList();
  createDelayList();


});
addBtn.addEventListener("click", () => {
  const inputboxText = taskInput.value.trim();
  const dueDatevalue = dueDate.value;

  if (!inputboxText || !dueDatevalue) return;

  const createDatevalue = new Date().toLocaleString("en-IN", {
    weekday: "long",
    year: "numeric",
    month: "short",
    day: "numeric",
  });

  /* ================= CREATE MODE ================= */
  if (
    updateTodoTaskIndex === -1 &&
    updateprogressTaskIndex === -1 &&
    updateDoneTaskIndex === -1 &&
    updateBacklogTaskIndex === -1
  ) {
    todoListData.push({
      title: inputboxText,
      createDate: createDatevalue,
      update: "",
      due: dueDatevalue,
    });

    localStorage.setItem("TODO", JSON.stringify(todoListData));
    createTodoList();
  }

  /* ================= UPDATE TODO ================= */
  else if (updateTodoTaskIndex !== -1) {
    Object.assign(todoListData[updateTodoTaskIndex], {
      title: inputboxText,
      due: dueDatevalue,
      update: createDatevalue,
    });

    localStorage.setItem("TODO", JSON.stringify(todoListData));
    createTodoList();
  }

  /* ================= UPDATE PROGRESS ================= */
  else if (updateprogressTaskIndex !== -1) {
    Object.assign(progressListData[updateprogressTaskIndex], {
      title: inputboxText,
      due: dueDatevalue,
      update: createDatevalue,
    });

    localStorage.setItem("PROGRESS", JSON.stringify(progressListData));
    createProgressList();
  }

  /* ================= UPDATE COMPLETED ================= */
  else if (updateDoneTaskIndex !== -1) {
    Object.assign(completedListData[updateDoneTaskIndex], {
      title: inputboxText,
      due: dueDatevalue,
      update: createDatevalue,
    });

    localStorage.setItem("COMPLETED", JSON.stringify(completedListData));
    createCompletedList();
  }

  /* ================= UPDATE BACKLOG ================= */
  else if (updateBacklogTaskIndex !== -1) {
    Object.assign(delayListData[updateBacklogTaskIndex], {
      title: inputboxText,
      due: dueDatevalue,
      update: createDatevalue,
    });

    localStorage.setItem("BACKLOG", JSON.stringify(delayListData));
    createDelayList();
  }

  resetUpdateIndexes();   // ← THIS FIXES YOUR BUG
  taskInput.value = "";
  dueDate.value = "";
});
